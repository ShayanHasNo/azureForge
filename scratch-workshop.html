<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>html,body{margin:0;height:100%;background:#000}#c{width:100vw;height:100vh;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { WorkshopScene } from '/src/workshop/scene.ts';
import { createDraft } from '/src/item/factory.ts';
import { refreshDerived } from '/src/item/finalize.ts';
const q = new URLSearchParams(location.search);
const mk = (cat, seed, f) => { const it = createDraft(cat, 'foundry', 'T', 1, 'Spring', seed); f && f(it); return refreshDerived(it); };
const items = [
  mk('sword', 1234, i => { i.materials.primary = 'brass'; }),
  mk('dagger', 5, i => { i.materials.primary = 'moonstone'; }),
  mk('shield', 3, i => { i.materials.primary='iron'; }),
  mk('sword', 77, i => { i.materials.primary = 'azuresteel'; }),
  mk('sword', 99, i => { i.materials.primary = 'dragonsteel'; }),
  mk('dagger', 8, i => { i.materials.primary = 'copper'; }),
  mk('shield', 4, i => { i.materials.primary='silver'; i.shield.faceMaterial='silver'; }),
  mk('sword', 31, i => { i.materials.primary = 'gardenglass'; }),
  mk('sword', 7, i => { i.materials.primary = 'starmetal'; }),
];
const all = q.get('all') === '1';
const state = {
  decor: { wall: q.get('wall')||'planks', floor: q.get('floor')||'boards', lighting: q.get('light')||'candles', window: q.get('win')||'small', forge: q.get('forge')||'brick', shelves: q.get('shelves')||'rack1' },
  extras: all ? ['rug','plants','cat','banner','bookshelf','clock','chimes','glassbloom'] : (q.get('extras')||'cat').split(',').filter(Boolean),
  upgrades: all ? ['smallanvil','bellows','loupe','wheel','finebench','gemsetter','shieldframe','collectionroom'] : (q.get('up')||'').split(',').filter(Boolean),
  displayItems: items.slice(0, +(q.get('n')||3)),
  phase: q.get('phase')||'morning', weather: q.get('weather')||'clear', season: q.get('season')||'Autumn',
  materialCount: +(q.get('mat')||20), bannerColor: q.get('banner')||'#3a5a8a', forgeLit: q.get('lit') !== '0',
};
window.__events = [];
const scene = new WorkshopScene(document.getElementById('c'), () => state, { onInteract: s => window.__events.push(s), onStep: () => {} , reducedMotion: () => q.get('rm')==='1'});
scene.start();
window.__scene = scene; window.__state = state;
</script></body></html>
